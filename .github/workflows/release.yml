name: release

# Build prebuilt binaries and publish a GitHub Release whenever a v* tag is
# pushed. The install.sh script and the Homebrew formula both consume the
# tarballs produced here.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball
        id: package
        run: |
          bin="target/${{ matrix.target }}/release/taipan"
          tarball="taipan-${{ matrix.target }}.tar.gz"
          tar -czf "$tarball" -C "target/${{ matrix.target }}/release" taipan
          # SHA256 — used by the Homebrew formula. shasum on macOS, sha256sum on Linux.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$tarball" > "$tarball.sha256"
          else
            shasum -a 256 "$tarball" > "$tarball.sha256"
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            taipan-${{ matrix.target }}.tar.gz
            taipan-${{ matrix.target }}.tar.gz.sha256

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true

  homebrew:
    name: update homebrew tap
    needs: release
    runs-on: ubuntu-latest
    # Requires a repo secret TAP_GITHUB_TOKEN: a PAT with `contents:write` on
    # turlockmike/homebrew-tap. If the secret is absent, this job is skipped so
    # the release still succeeds (update the formula manually in that case).
    if: ${{ github.repository_owner == 'turlockmike' }}
    steps:
      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: turlockmike/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap
        continue-on-error: true
        id: checkout_tap

      - name: Regenerate formula from template
        if: steps.checkout_tap.outcome == 'success'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          sha() { awk '{print $1}' "dist/taipan-$1.tar.gz.sha256"; }
          arm_sha="$(sha aarch64-apple-darwin)"
          intel_sha="$(sha x86_64-apple-darwin)"
          linux_sha="$(sha x86_64-unknown-linux-gnu)"
          base="https://github.com/turlockmike/taipan-rs/releases/download/${TAG}"

          # Emit the whole formula — no surgical edits, nothing order-fragile.
          cat > tap/Formula/taipan.rb <<EOF
          # Homebrew formula for Taipan! — the China Seas trading game.
          # Generated by the release workflow in turlockmike/taipan-rs. Do not edit by hand.
          class Taipan < Formula
            desc "Dependency-free Rust recreation of the classic 1982 China Seas trading game"
            homepage "https://github.com/turlockmike/taipan-rs"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/taipan-aarch64-apple-darwin.tar.gz"
                sha256 "${arm_sha}"
              end
              on_intel do
                url "${base}/taipan-x86_64-apple-darwin.tar.gz"
                sha256 "${intel_sha}"
              end
            end

            on_linux do
              on_intel do
                url "${base}/taipan-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${linux_sha}"
              end
            end

            def install
              bin.install "taipan"
            end

            test do
              assert_match "Taipan!", shell_output("#{bin}/taipan --help")
            end
          end
          EOF

      - name: Commit and push tap
        if: steps.checkout_tap.outcome == 'success'
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/taipan.rb
          git commit -m "taipan ${GITHUB_REF_NAME}" || { echo "no changes"; exit 0; }
          git push
